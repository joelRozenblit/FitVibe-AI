<div class="flex flex-col h-full w-full">
  <label class="mb-2 text-xs font-bold text-slate-500 text-right uppercase tracking-tighter">{{ label }}</label>
  
  <div class="relative flex-1 min-h-0 group border-2 border-dashed border-slate-300 rounded-3xl bg-white hover:border-indigo-500 transition-all overflow-hidden flex items-center justify-center">
    
    @if (previewUrl) {
      <div class="absolute inset-0">
        <img [src]="previewUrl" class="w-full h-full object-cover">
        <button (click)="removeImage()" class="absolute top-2 right-2 bg-white/80 hover:bg-red-500 hover:text-white w-8 h-8 rounded-full shadow-md flex items-center justify-center transition-colors">✕</button>
      </div>
    } @else {
      <label class="w-full h-full flex flex-col items-center justify-center cursor-pointer hover:bg-slate-50 transition-colors">
        <div class="text-indigo-400 mb-2">
           <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        </div>
        <span class="text-[10px] font-bold text-slate-400 uppercase">העלאה</span>
        <input type="file" class="hidden" (change)="onFileChange($event)" accept="image/*">
      </label>
    }
  </div>
</div>
