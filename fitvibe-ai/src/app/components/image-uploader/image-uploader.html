<div class="flex flex-col w-full max-w-sm mx-auto">
  <label class="mb-3 text-lg font-medium text-slate-700 text-right">{{ label }}</label>
  
  <div class="relative group border-2 border-dashed border-slate-300 rounded-3xl p-4 bg-white hover:border-indigo-500 transition-all duration-300 flex items-center justify-center min-h-[300px]">
    
    @if (previewUrl) {
      <div class="relative w-full h-full rounded-2xl overflow-hidden shadow-md">
        <img [src]="previewUrl" class="w-full h-full object-cover">
        <button (click)="removeImage()" class="absolute top-3 right-3 bg-white/90 hover:bg-red-500 hover:text-white text-slate-800 w-8 h-8 rounded-full shadow-lg transition-all flex items-center justify-center">✕</button>
      </div>
    } @else {
      <label class="flex flex-col items-center justify-center w-full h-full cursor-pointer py-10">
        <div class="bg-indigo-50 p-4 rounded-full mb-4 group-hover:scale-110 transition-transform">
          <svg class="w-8 h-8 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
        </div>
        <p class="text-slate-500 font-medium">לחצי להעלאת תמונה</p>
        <p class="text-slate-400 text-xs mt-1">JPG, PNG (עד 5MB)</p>
        <input type="file" class="hidden" (change)="onFileChange($event)" accept="image/*">
      </label>
    }
  </div>
</div>
