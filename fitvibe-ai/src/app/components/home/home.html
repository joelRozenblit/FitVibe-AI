<div class="min-h-screen bg-[#f8fafc] text-slate-900 font-sans pb-20">
  <header class="py-10 text-center">
    <h1 class="text-5xl font-black tracking-tight mb-2 italic bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-purple-600">
      FitVibe AI
    </h1>
  </header>

  <main class="max-w-6xl mx-auto px-6">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-12 mt-8">
      <app-image-uploader label="תמונה שלך" (fileSelected)="onUserImage($event)"></app-image-uploader>
      <app-image-uploader label="תמונת הבגד" (fileSelected)="onGarmentImage($event)"></app-image-uploader>
    </div>

    <div class="mt-16 flex flex-col items-center gap-8">
      <button
        (click)="startMagic()"
        [disabled]="!userFile || !garmentFile || isLoading"
        class="group relative px-12 py-5 bg-slate-900 text-white rounded-full font-bold text-xl shadow-2xl transition-all duration-300 hover:bg-indigo-600 disabled:bg-slate-300 disabled:cursor-not-allowed overflow-hidden"
      >
        <span class="relative z-10 flex items-center gap-2">
          @if (isLoading) { מעבד נתונים... } @else { בצעי מדידה עכשיו <span>✨</span> }
        </span>

        @if (isLoading) {
          <div class="absolute inset-0 bg-indigo-600 flex items-center justify-center">
            <div class="w-6 h-6 border-4 border-white border-t-transparent rounded-full animate-spin"></div>
          </div>
        }
      </button>

      @if (resultImage && !isLoading) {
        <div class="w-full max-w-2xl animate-in fade-in slide-in-from-bottom-10 duration-1000 mt-8">
          <h2 class="text-3xl font-bold mb-6 text-center text-slate-800">וואו! ככה זה נראה:</h2>
          <div class="rounded-3xl overflow-hidden shadow-2xl border-4 border-white bg-white">
            <img [src]="resultImage" alt="Result" class="w-full h-auto" />
          </div>
          <button (click)="resultImage = null" class="mt-6 text-indigo-600 font-bold hover:underline block mx-auto">
            רוצה לנסות בגד אחר?
          </button>
        </div>
      }
    </div>
  </main>
</div>
