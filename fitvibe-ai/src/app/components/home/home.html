<div class="min-h-screen md:h-screen bg-[#f1f5f9] text-slate-900 font-sans flex flex-col overflow-y-auto md:overflow-hidden">
  
  <header class="h-[7vh] min-h-[50px] flex items-center justify-center bg-white shrink-0 shadow-sm z-10">
    <h1 class="text-xl md:text-2xl font-black italic bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-purple-600">
      FitVibe AI
    </h1>
  </header>

  <main class="flex-1 flex justify-center items-center p-4 md:p-8 min-h-0">
    
    <div class="w-full max-w-6xl h-full flex flex-col md:grid md:grid-cols-12 gap-6">
      
      <div class="md:col-span-4 flex flex-col gap-4 h-full min-h-0">
        
        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest text-right">העלאת נתונים</label>

        <div class="grid grid-cols-2 gap-3 flex-1 md:min-h-0">
          <div class="h-60 md:h-full">
            <app-image-uploader 
              label="תמונה שלך" 
              class="h-full"
              (fileSelected)="onUserImage($event)">
            </app-image-uploader>
          </div>
          <div class="h-60 md:h-full">
            <app-image-uploader 
              label="תמונת הבגד" 
              class="h-full"
              (fileSelected)="onGarmentImage($event)">
            </app-image-uploader>
          </div>
        </div>

        <button
          (click)="startMagic()"
          [disabled]="!userFile || !garmentFile || isLoading"
          class="w-full h-14 shrink-0 bg-slate-900 text-white rounded-2xl font-bold text-lg shadow-lg hover:bg-indigo-600 active:scale-95 transition-all disabled:bg-slate-200"
        >
          @if (isLoading) { מעבד... } @else { בצעי מדידה ✨ }
        </button>
      </div>

      <div class="md:col-span-8 flex flex-col h-full min-h-0">
        
        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest text-right">התוצאה הסופית</label>
        
        <div class="flex-1 min-h-[400px] bg-white rounded-[2rem] border border-slate-200 flex flex-col items-center justify-center relative overflow-hidden shadow-xl mt-1">
          
          @if (isLoading) {
            <div class="flex flex-col items-center gap-3">
              <div class="w-10 h-10 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
              <p class="text-indigo-600 font-medium animate-pulse text-sm">מייצר את הלוק...</p>
            </div>
          } @else if (resultImage) {
            <div class="absolute inset-0 p-6 bg-white flex items-center justify-center">
              <img [src]="resultImage" class="max-w-full max-h-full object-contain rounded-xl" alt="Result" />
              <button 
                (click)="resultImage = null" 
                class="absolute top-4 right-4 bg-slate-100 text-slate-500 w-8 h-8 rounded-full hover:bg-red-50 flex items-center justify-center transition-colors"
              >
                ✕
              </button>
            </div>
          } @else {
            <div class="text-center opacity-40">
              <span class="text-5xl block mb-4">👗</span>
              <p class="text-sm font-medium text-slate-500">התוצאה תופיע כאן</p>
            </div>
          }

        </div>
      </div>

    </div>
  </main>
</div>
