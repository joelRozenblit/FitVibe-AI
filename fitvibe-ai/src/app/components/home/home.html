<div class="min-h-screen bg-[#f8fafc] text-slate-900 font-sans">
  <header class="py-10 text-center">
    <h1
      class="text-5xl font-black tracking-tight mb-2 italic bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-purple-600"
    >
      FitVibe AI
    </h1>
    <p class="text-slate-500 text-lg">המדידה הוירטואלית הבאה שלך מתחילה כאן</p>
  </header>

  <main class="max-w-6xl mx-auto px-6">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-12 mt-8">
      <app-image-uploader
        label="תמונה שלך"
        (fileSelected)="onUserImage($event)"
      ></app-image-uploader>
      <app-image-uploader
        label="תמונת הבגד"
        (fileSelected)="onGarmentImage($event)"
      ></app-image-uploader>
    </div>

    <div class="mt-16 flex justify-center pb-20">
      <button
        (click)="startMagic()"
        [disabled]="!userFile || !garmentFile || isLoading"
        class="group relative px-12 py-5 bg-slate-900 text-white rounded-full font-bold text-xl shadow-2xl transition-all duration-300 hover:bg-indigo-600 disabled:bg-slate-300 disabled:cursor-not-allowed overflow-hidden"
      >
        <span class="relative z-10 flex items-center gap-2">
          {{ isLoading ? 'מעבד נתונים...' : 'בצעי מדידה עכשיו' }}
          <span *ngIf="!isLoading" class="group-hover:translate-x-1 transition-transform">✨</span>
        </span>

        <div
          *ngIf="isLoading"
          class="absolute inset-0 bg-indigo-600 flex items-center justify-center"
        >
          <div
            class="w-6 h-6 border-4 border-white border-t-transparent rounded-full animate-spin"
          ></div>
        </div>
      </button>
    </div>
  </main>
</div>
